<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1e293b; }
      .subtitle-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .class-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .class-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-style: italic; fill: #475569; text-anchor: middle; }
      .attr-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #334155; }
      .method-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #0f766e; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 6; }
      .box-header { fill: #f8fafc; stroke: #1e293b; stroke-width: 2; }
      .tree-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; }
      .tree-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #1e293b; }
      .tree-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .badge { fill: #881337; rx: 3; }
      .badge-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .card-rel { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
    </style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="1170" height="650" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Header -->
  <text x="45" y="55" class="title-text">MAFE — Diagrama de Classes ORM &amp; Estrutura do Back-end</text>
  <text x="45" y="78" class="subtitle-text">Arquitetura Python / Flask 3.0 / SQLAlchemy 3.1 / PyMySQL — Maturidade Feliz (Entrega #4)</text>

  <!-- ==================== ESTRUTURA DE ARQUIVOS (ESQUERDA) ==================== -->
  <rect x="45" y="110" width="310" height="520" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <rect x="45" y="110" width="310" height="42" fill="#0f172a" rx="8"/>
  <rect x="45" y="142" width="310" height="10" fill="#0f172a"/>
  <text x="65" y="137" font-family="'Segoe UI', Arial, sans-serif" font-size="15px" font-weight="bold" fill="#ffffff">Estrutura de Arquivos: backend/</text>

  <!-- Tree Items -->
  <g transform="translate(65, 175)">
    <!-- app.py -->
    <text x="0" y="0" class="tree-text">📄 app.py</text>
    <text x="24" y="16" class="tree-desc">Rotas RESTful, CORS e Auth</text>
    
    <!-- config.py -->
    <text x="0" y="45" class="tree-text">📄 config.py</text>
    <text x="24" y="61" class="tree-desc">Normalização URI MySQL &amp; Pool</text>
    
    <!-- models.py -->
    <text x="0" y="90" class="tree-text">📄 models.py</text>
    <text x="24" y="106" class="tree-desc">Classes ORM &amp; Persistência</text>
    
    <!-- criar_db.py -->
    <text x="0" y="135" class="tree-text">📄 criar_db.py</text>
    <text x="24" y="151" class="tree-desc">Criação do mafe_db &amp; db.create_all</text>
    
    <!-- dominio_poo.py -->
    <text x="0" y="180" class="tree-text">📄 dominio_poo.py</text>
    <text x="24" y="196" class="tree-desc">Classes de Domínio &amp; Herança</text>
    
    <!-- schema.sql -->
    <text x="0" y="225" class="tree-text">📄 schema.sql</text>
    <text x="24" y="241" class="tree-desc">Script DDL oficial MySQL (4 tabelas)</text>
    
    <!-- requirements.txt -->
    <text x="0" y="270" class="tree-text">📄 requirements.txt</text>
    <text x="24" y="286" class="tree-desc">Flask, SQLAlchemy, PyMySQL</text>

    <!-- Divider box inside tree -->
    <line x1="0" y1="320" x2="270" y2="320" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Resumo Técnico -->
    <text x="0" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold" fill="#334155">Padrões Aplicados:</text>
    <text x="0" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#475569">• ORM com métodos encapsulados</text>
    <text x="0" y="382" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#475569">• Soft-delete com campo 'ativo'</text>
    <text x="0" y="399" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#475569">• Hash Werkzeug para Admin (RN08)</text>
    <text x="0" y="416" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#475569">• Resposta JSON padrão uniforme</text>
    <text x="0" y="433" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" fill="#475569">• Pool resiliente: recycle=280s</text>
  </g>

  <!-- ==================== DIAGRAMA DE CLASSES UML (DIREITA) ==================== -->

  <!-- 1. CLASSE CATEGORIA -->
  <g transform="translate(390, 110)">
    <rect width="220" height="230" class="box"/>
    <path d="M 0 0 L 220 0 L 220 50 L 0 50 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" rx="6"/>
    <rect x="0" y="40" width="220" height="10" fill="#f1f5f9"/>
    <text x="110" y="28" class="class-title">Categoria</text>
    <text x="110" y="43" class="class-sub">&lt;&lt;categorias_galeria&gt;&gt;</text>
    
    <!-- Atributos -->
    <line x1="0" y1="50" x2="220" y2="50" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="72" class="attr-text">- id: Integer [PK]</text>
    <text x="12" y="92" class="attr-text">- nome: String(255) [UQ]</text>
    
    <!-- Métodos -->
    <line x1="0" y1="108" x2="220" y2="108" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="12" y="130" class="method-text">+ cadastrar(): Categoria</text>
    <text x="12" y="152" class="method-text">+ atualizar(novo_nome)</text>
    <text x="12" y="174" class="method-text">+ deletar(): void</text>
    <text x="12" y="196" class="method-text">+ listar_todas(): list</text>
    <text x="12" y="218" class="method-text">+ to_dict(): dict</text>
  </g>

  <!-- SETA DE RELACIONAMENTO: Categoria 1 -> N Midia -->
  <path d="M 610 200 L 680 200" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="192" class="card-rel">1</text>
  <text x="662" y="192" class="card-rel">N</text>

  <!-- 2. CLASSE MIDIA -->
  <g transform="translate(690, 110)">
    <rect width="250" height="340" class="box"/>
    <path d="M 0 0 L 250 0 L 250 50 L 0 50 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" rx="6"/>
    <rect x="0" y="40" width="250" height="10" fill="#f1f5f9"/>
    <text x="125" y="28" class="class-title">Midia</text>
    <text x="125" y="43" class="class-sub">&lt;&lt;midias&gt;&gt;</text>
    
    <!-- Atributos -->
    <line x1="0" y1="50" x2="250" y2="50" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="70" class="attr-text">- id: Integer [PK]</text>
    <text x="12" y="88" class="attr-text">- categoria_id: Integer [FK]</text>
    <text x="12" y="106" class="attr-text">- titulo: String(255)</text>
    <text x="12" y="124" class="attr-text">- descricao: Text</text>
    <text x="12" y="142" class="attr-text">- url_midia: String(500)</text>
    <text x="12" y="160" class="attr-text">- tipo_midia: Enum('foto','video')</text>
    <text x="12" y="178" class="attr-text">- ano: Integer</text>
    <text x="12" y="196" class="attr-text">- visualizacoes: Integer</text>
    <text x="12" y="214" class="attr-text">- ativo: Boolean = True</text>
    
    <!-- Métodos -->
    <line x1="0" y1="228" x2="250" y2="228" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="12" y="248" class="method-text">+ cadastrar(): Midia</text>
    <text x="12" y="268" class="method-text">+ atualizar(dados): Midia</text>
    <text x="12" y="288" class="method-text">+ alternar_status(): Midia</text>
    <text x="12" y="308" class="method-text">+ deletar(): void</text>
    <text x="12" y="328" class="method-text">+ to_dict(): dict</text>
  </g>

  <!-- 3. CLASSE APOIADOR -->
  <g transform="translate(965, 110)">
    <rect width="210" height="300" class="box"/>
    <path d="M 0 0 L 210 0 L 210 50 L 0 50 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" rx="6"/>
    <rect x="0" y="40" width="210" height="10" fill="#f1f5f9"/>
    <text x="105" y="28" class="class-title">Apoiador</text>
    <text x="105" y="43" class="class-sub">&lt;&lt;apoiadores&gt;&gt;</text>
    
    <!-- Atributos -->
    <line x1="0" y1="50" x2="210" y2="50" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="70" class="attr-text">- id: Integer [PK]</text>
    <text x="12" y="88" class="attr-text">- nome_empresa: String</text>
    <text x="12" y="106" class="attr-text">- descricao: Text</text>
    <text x="12" y="124" class="attr-text">- logo_url: String</text>
    <text x="12" y="142" class="attr-text">- site_url: String [Null]</text>
    <text x="12" y="160" class="attr-text">- visualizacoes: Integer</text>
    <text x="12" y="178" class="attr-text">- ativo: Boolean = True</text>
    
    <!-- Métodos -->
    <line x1="0" y1="192" x2="210" y2="192" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="12" y="212" class="method-text">+ cadastrar(): Apoiador</text>
    <text x="12" y="232" class="method-text">+ atualizar(dados)</text>
    <text x="12" y="252" class="method-text">+ alternar_status()</text>
    <text x="12" y="272" class="method-text">+ deletar(): void</text>
    <text x="12" y="292" class="method-text">+ to_dict(): dict</text>
  </g>

  <!-- 4. CLASSE ESTATISTICAGRUPO -->
  <g transform="translate(390, 420)">
    <rect width="360" height="210" class="box"/>
    <path d="M 0 0 L 360 0 L 360 50 L 0 50 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" rx="6"/>
    <rect x="0" y="40" width="360" height="10" fill="#f1f5f9"/>
    <text x="180" y="28" class="class-title">EstatisticaGrupo</text>
    <text x="180" y="43" class="class-sub">&lt;&lt;estatisticas_grupo&gt;&gt;</text>
    
    <!-- Atributos -->
    <line x1="0" y1="50" x2="360" y2="50" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="74" class="attr-text">- id: Integer [PK]</text>
    <text x="12" y="94" class="attr-text">- quantidade_participantes: Integer = 48</text>
    <text x="12" y="114" class="attr-text">- quantidade_torneios: Integer = 14</text>
    <text x="12" y="134" class="attr-text">- ano_fundacao: Integer = 2019 [Protegido]</text>
    
    <!-- Métodos -->
    <line x1="0" y1="148" x2="360" y2="148" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="12" y="172" class="method-text">+ obter_estatisticas(): EstatisticaGrupo</text>
    <text x="12" y="194" class="method-text">+ atualizar_metricas(part, torn, ano): EstatisticaGrupo</text>
  </g>

  <!-- 5. PAINEL DE CONTINGÊNCIA / CONFIGURAÇÃO -->
  <g transform="translate(775, 470)">
    <rect width="400" height="160" fill="#fff1f2" stroke="#be123c" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="14px" font-weight="bold" fill="#9f1239">Contingência e Segurança (painelAdmMAFE)</text>
    <text x="20" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#881337">• Autenticação: hash Werkzeug (coordenacao / 123456)</text>
    <text x="20" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#881337">• Flag USAR_STORAGE_CONTINGENCIA: simula em localStorage</text>
    <text x="20" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#881337">• Modais de confirmação em todas as ações de escrita</text>
    <text x="20" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#881337">• Integridade: ON DELETE RESTRICT em Categoria/Midia</text>
    <text x="20" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" fill="#881337">• Formato de resposta: { sucesso: true, dados: [...], mensagem }</text>
  </g>

</svg>
